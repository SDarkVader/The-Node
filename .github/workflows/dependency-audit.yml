name: Dependency security audit
on:
  push:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
