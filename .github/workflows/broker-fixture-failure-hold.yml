name: Broker failure hold verification
on:
  push:
    branches:
      - broker-fixture-failure-hold-2026-10-17
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native broker verification
        shell: pwsh
        run: |
          ./scripts/verify-broker-recovery.ps1 -TypeScriptRoot "$PWD/node_modules" -BuildDirectory "$PWD/.broker-native-build"
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/vitest/vitest.mjs run --pool=threads --maxWorkers=2 --no-file-parallelism
